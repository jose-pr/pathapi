site_name: pathapi
site_description: Generic Path Protocol based pathlib
site_url: https://jose-pr.github.io/pathapi/
repo_url: https://github.com/jose-pr/pathapi
repo_name: jose-pr/pathapi
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Guides:
      - Extending: guides/extending.md
  - Benchmarks: benchmarks.md
  - Divergences from pathlib: divergences.md
  - API Reference:
      - Core Path: api/path.md
      - Memory Path: api/mempath.md
      - FTP Path: api/ftp.md
      - HTTP: api/http.md
      - Archive Paths: api/archive.md
      - Protocols: api/protocols.md
      - Sync: api/sync.md
      - Glob: api/glob.md
      - Checksum: api/checksum.md
      - Providers: api/providers.md
      - Exceptions: api/exceptions.md
      - Testing Contracts: api/testing.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            show_if_no_docstring: true

markdown_extensions:
  - admonition
  - tables
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
