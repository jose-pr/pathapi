name: Test

# On-demand / ad-hoc test workflow, kept separate from release.yml's own
# release-gate test job so it can be run without cutting a release. Two ways
# to trigger it:
#   - workflow_dispatch (optionally against a specific ref), for manual runs.
#   - push of a tag matching "ci-*" (throwaway tag, delete after) so an agent
#     without dashboard access can trigger + poll a run via the API/CLI.
# Not triggered by push/PR on branches by default -- add that only if the
# project actually wants CI on every commit.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (branch, tag, or SHA)"
        required: false
        default: ""
      benchmark:
        description: "Also run the benchmark suite (manual runs only)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "ci-*"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu full matrix over every supported version
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # Windows/macOS matrix edges (oldest + newest supported)
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test dependencies
        # `dev` holds every package a test imports (pyftpdlib, cryptography,
        # hypothesis), or those tests would skip instead of running.
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        # -rs lists every skip with its reason, so a missing package shows up.
        run: python -m pytest -q -rs

  test-no-extras:
    name: Test No-Extras (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without extras
        # Exactly `pip install pathlib-next` plus the test runner and the FTP
        # server the `FTPPath` tests talk to: what a user who installs only the
        # package has.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pyftpdlib
      - name: Run the test suite without extras
        # Every test module must collect, and each test pass or skip cleanly,
        # with no optional package installed.
        run: python -m pytest -q -rs

  # The two typing checks of tests/test_public_surface.py (mypy and pyright on
  # a consumer script) skip unless a checker is importable, and no other job
  # installs one: they run here. The step fails if either was skipped.
  typing:
    name: Typing checks (py${{ matrix.python-version }}, ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package, pytest and the two checkers
        # basedpyright, not the PyPI `pyright`: that one downloads node at
        # run time. The test accepts either.
        run: python -m pip install -e . pytest mypy basedpyright
      - name: Run the typing checks
        run: |
          python -m pytest -q -rs tests/test_public_surface.py -k "mypy_accepts or pyright_accepts" | tee typing.log
          grep -q "2 passed" typing.log

  benchmark:
    name: Benchmarks (py3.14, ${{ matrix.os }})
    # Opt-in: benchmarks are noisy and slow, so they never run on ci-* tags
    # or by default; dispatch the workflow with benchmark=true.
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run benchmark suite
        shell: pwsh
        run: |
          python benchmarks/bench.py --save --name "ci-${{ matrix.os }}-py3.14" | Tee-Object -FilePath benchmark.txt
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            benchmark.txt
            benchmarks/results/*.json
