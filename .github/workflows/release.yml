name: Release

# Runs when a final `pathlib-next-vX.Y.Z` tag is pushed (`pathlib-next-v0.10.1`).
# `v*` tags of this repository are `pathapi` releases and are handled on `main`;
# this branch only builds the last `pathlib-next` release, a shim over `pathapi`.
#
# Test gate, build (the tag must name the version built), an installed-wheel smoke
# test, the GitHub Release, then the upload to PyPI through Trusted Publishing.
on:
  push:
    tags:
      - "pathlib-next-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  # A git ref of jose-pr/pathapi to install instead of the PyPI release, from the
  # repository variable PATHAPI_REF. Publishing refuses to run while it is set.
  CORE_REF: ${{ vars.PATHAPI_REF }}

jobs:
  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.14"] # oldest + newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pathapi from the git ref, if one is set
        if: ${{ env.CORE_REF != '' }}
        shell: bash
        run: python -m pip install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"
      - name: Install the package and the test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q -rs

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      # A tag on the wrong commit would otherwise publish a release named for
      # one version that carries another version's artifacts.
      - name: The tag names the version that was built
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import sys

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ["TAG"]
          prefix = "pathlib-next-v"
          if not tag.startswith(prefix):
              sys.exit("tag %s does not start with %s" % (tag, prefix))
          want = Version(tag[len(prefix):])
          dist = pathlib.Path("dist")
          built = {str(parse_wheel_filename(p.name)[1]) for p in dist.glob("*.whl")}
          built |= {str(parse_sdist_filename(p.name)[1]) for p in dist.glob("*.tar.gz")}
          if built != {str(want)}:
              sys.exit("tag %s is version %s, but dist/ holds %s" % (tag, want, sorted(built)))
          print("tag %s matches the built version %s" % (tag, want))
      - name: Verify sdist and wheel
        run: python -m twine check dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a user installs is the wheel: it holds the shim and nothing else, asks
  # for pathapi, and imports against a pathapi installed beside it.
  wheel-smoke:
    name: Installed-wheel smoke test (py${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the venv, with pathapi from the git ref if one is set
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -n "$CORE_REF" ]; then
            "$RUNNER_TEMP/smoke/bin/pip" install "pathapi @ git+https://github.com/jose-pr/pathapi@${CORE_REF}"
          fi
      - name: Install the wheel
        run: '"$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl'
      - name: Import it and check what it ships
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import warnings
          from importlib.metadata import files, requires

          shipped = sorted(
              str(f) for f in files("pathlib-next") if f.parts[0] == "pathlib_next" and f.suffix != ".pyc"
          )
          assert shipped == ["pathlib_next/__init__.py", "pathlib_next/py.typed"], shipped
          wanted = [r.replace(" ", "") for r in requires("pathlib-next") if "extra ==" not in r]
          assert wanted == ["pathapi<0.2,>=0.1.0"], wanted
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import pathlib_next
              import pathapi
              from pathlib_next.protocols import Stat
          assert [w.category for w in caught] == [DeprecationWarning], caught
          assert pathlib_next.Path is pathapi.Path
          import pathapi.protocols
          assert Stat is pathapi.protocols.Stat
          print("ok:", pathlib_next.__version__, "over pathapi", pathapi.__version__)
          PY

  github-release:
    name: Create GitHub Release
    needs: [build, wheel-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG.md section for this tag
        shell: python
        # The tag reaches the script as data (an environment variable), never
        # spliced into its source.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"]
          prefix = "pathlib-next-v"
          if not tag.startswith(prefix):
              sys.exit(f"tag {tag!r} does not start with {prefix!r}")
          version = tag[len(prefix):]

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:\s|\Z)",
              changelog,
              re.DOTALL | re.MULTILINE,
          )
          if not match:
              sys.exit(f"No CHANGELOG.md section found for version {version!r}")
          pathlib.Path("release_notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
      - name: Create GitHub Release
        # Pinned to a commit: this action runs with contents: write.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md

  # A PyPI upload is irreversible: this runs after the GitHub release.
  publish-pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pathlib-next/
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Refuse to publish while PATHAPI_REF is set
        if: ${{ env.CORE_REF != '' }}
        run: |
          echo "PATHAPI_REF is set: a final release is tested against the pathapi release on PyPI. Release pathapi first and delete the repository variable." >&2
          exit 1
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
