[build-system]
# PEP 639 `license`/`license-files` below need hatchling 1.27 or newer.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pathlib-next"
version = "0.10.1"
authors = [{ name = "Jose A" }]
description = "Renamed pathapi: this package depends on it and re-exports it as pathlib_next"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["pathapi>=0.1.0,<0.2"]

[project.optional-dependencies]
dev = ['pytest', 'black', 'build', 'twine', 'hatchling']

[project.urls]
Homepage = "https://github.com/jose-pr/pathapi/"
Documentation = "https://jose-pr.github.io/pathapi/"
Issues = "https://github.com/jose-pr/pathapi/issues"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pathlib_next"]

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]
